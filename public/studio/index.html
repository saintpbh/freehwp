<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./favicon.ico" />
  <title>rhwp-studio</title>
  <script type="module" crossorigin src="./assets/index-CLFj6l1g.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CYyZHUt1.css">
</head>
<body>
  <div id="studio-root">
    <!-- NEW Minimal Toolbar -->
    <div id="minimal-toolbar" class="minimal-toolbar">
      <!-- Headings -->
      <button class="sb-btn heading-btn" data-heading="1" title="제목 1 (H1)"><span class="tb-icon-text">H1</span></button>
      <button class="sb-btn heading-btn" data-heading="2" title="제목 2 (H2)"><span class="tb-icon-text">H2</span></button>
      <button class="sb-btn heading-btn" data-heading="3" title="본문 (H3)"><span class="tb-icon-text">H3</span></button>
      <div class="mt-sep"></div>

      <!-- Font Family -->
      <select id="tb-font-family" class="tb-select" title="글꼴">
        <option value="함초롬바탕">함초롬바탕</option>
        <option value="바탕">바탕</option>
        <option value="돋움">돋움</option>
        <option value="굴림">굴림</option>
        <option value="맑은 고딕">맑은 고딕</option>
        <option value="나눔고딕">나눔고딕</option>
      </select>
      
      <div class="mt-sep"></div>

      <!-- Zoom -->
      <select id="tb-zoom-select" class="tb-select" title="보기 배율">
        <option value="0.7">70%</option>
        <option value="1.0" selected>100%</option>
        <option value="1.2">120%</option>
        <option value="1.5">150%</option>
        <option value="2.0">200%</option>
        <option value="2.5">250%</option>
      </select>

      <div class="mt-sep"></div>

      <!-- Text Styles -->
      <button id="btn-bold" class="sb-btn" title="굵게 (Ctrl+B)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 12a4 4 0 0 0 0-8H6v8"/><path d="M15 20a4 4 0 0 0 0-8H6v8Z"/></svg>
      </button>
      <button id="btn-italic" class="sb-btn" title="기울임 (Ctrl+I)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
      </button>

      <!-- Color / Highlight -->
      <span class="sb-color-wrap">
        <button id="btn-text-color" class="sb-btn sb-has-arrow" title="글자 색">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span id="color-bar"></span><span class="sb-dd">▾</span>
        </button>
        <input id="text-color-picker" type="color" value="#000000" style="display:none" />
      </span>
      <span id="highlight-dropdown" class="sb-dropdown">
        <button id="btn-highlight" class="sb-btn sb-has-arrow" title="형광펜 (배경색)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 2 6 6-10 10-6-6Z"/><path d="M2 22h20"/></svg>
          <span id="highlight-bar"></span><span class="sb-dd">▾</span>
        </button>
        <div id="highlight-palette" class="sb-hl-palette"></div>
      </span>
      <div class="mt-sep"></div>
      
      <!-- Alignment -->
      <button id="btn-align-left" class="sb-btn" title="오른쪽 정렬"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="6" x2="3" y2="6"/><line x1="15" y1="12" x2="3" y2="12"/><line x1="17" y1="18" x2="3" y2="18"/></svg></button>
      <button id="btn-align-center" class="sb-btn" title="가운데 정렬"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="6" x2="3" y2="6"/><line x1="19" y1="12" x2="5" y2="12"/><line x1="19" y1="18" x2="5" y2="18"/></svg></button>
      <button id="btn-align-right" class="sb-btn" title="오른쪽 정렬"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="12" x2="9" y2="12"/><line x1="21" y1="18" x2="7" y2="18"/></svg></button>
      <div class="mt-sep"></div>

      <!-- Lists & Quote -->
      <button class="tb-btn mt-tb-btn" id="tb-numbering" data-cmd="format:toggle-numbering" title="문단 번호">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>
      </button>
      <button class="tb-btn mt-tb-btn" id="tb-bullet" title="글머리표">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
      <div class="mt-sep"></div>

      <!-- Inserts & Tools -->
      <button class="tb-btn mt-tb-btn" data-cmd="insert:image" title="그림 삽입">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>
      <button class="tb-btn mt-tb-btn" data-cmd="table:create" title="표 삽입">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
      </button>
      <!-- Request: Add New Document button to icon tray! -->
      <div class="mt-sep"></div>
      <button class="tb-btn mt-tb-btn host-action-btn" data-host-action="new-file" title="새 문서">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M14.5 18 12 15.5 9.5 18"/><path d="M12 15.5v5.5"/><path d="M17.5 7.5 14 4H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2z"/></svg>
      </button>
      <button class="tb-btn mt-tb-btn host-action-btn" data-host-action="insert-bible" title="성경 검색/삽입 (Cmd+J)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M8 7h6"/><path d="M8 11h8"/></svg>
      </button>
    </div>

    <!-- Hidden Legacy UI for backwards compatibility with main.ts & toolbar.ts -->
    <div id="legacy-ui" style="display:none;">
      <div id="menu-bar"></div>
      <div id="icon-toolbar">
         <input type="file" id="file-input" accept=".hwp,.hwpx" />
      </div>
      <div id="style-bar">
        <select id="style-name"></select>
        <select id="font-lang"></select>
        <select id="font-name"></select>
        <input id="font-size" type="text" />
        <button id="btn-size-up"></button>
        <button id="btn-size-down"></button>
        <div id="charfx-dropdown">
          <button id="btn-charfx"></button>
          <span id="charfx-icon"></span>
          <div id="charfx-menu"></div>
        </div>
        <select id="linespacing-select"></select>
        <button id="btn-ls-up"></button>
        <button id="btn-ls-down"></button>
        <button id="btn-align-distribute"></button>
        <button id="btn-align-split"></button>
      </div>
    </div>

    <!-- 에디터 영역 (눈금자 포함) -->
    <div id="editor-area">
      <div id="ruler-corner" style="display:none"></div>
      <canvas id="h-ruler" style="display:none"></canvas>
      <canvas id="v-ruler" style="display:none"></canvas>
      <div id="scroll-container">
        <div id="scroll-content"></div>
      </div>
    </div>

    <!-- 하단 상태 바 -->
    <div id="status-bar" style="display:none">
      <span id="sb-page" class="stb-item">1 / 1 쪽</span>
      <span class="stb-divider"></span>
      <span id="sb-section" class="stb-item">구역: 1 / 1</span>
      <span class="stb-divider"></span>
      <span id="sb-mode" class="stb-item">삽입</span>
      <span id="sb-field" class="stb-item" style="display:none"></span>
      <span id="sb-message" class="stb-message"></span>
      <span class="stb-right">
        <button id="sb-zoom-fit-width" class="stb-icon-btn" title="폭 맞춤"><span class="tb-sprite icon-zoom-fit-width"></span></button>
        <button id="sb-zoom-fit" class="stb-icon-btn" title="쪽 맞춤"><span class="tb-sprite icon-zoom-fit"></span></button>
        <span class="stb-divider"></span>
        <span id="sb-zoom-val" class="stb-zoom-val">100%</span>
        <button id="sb-zoom-out" class="stb-icon-btn" title="축소"><span class="tb-sprite icon-zoom-out"></span></button>
        <button id="sb-zoom-in" class="stb-icon-btn" title="확대"><span class="tb-sprite icon-zoom-in"></span></button>
      </span>
    </div>
  </div>
</body>
</html>
